name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint without increasing the current warning baseline
        run: npm run lint -- --max-warnings=8

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-not-for-production
          NEXT_TELEMETRY_DISABLED: '1'
