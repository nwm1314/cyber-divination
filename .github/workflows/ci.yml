name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Bazi skill provenance
        run: npm run check:skill

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        run: npm test

      - name: Run independent Ziwei validation gate
        run: node scripts/compare-iztro.mjs

      - name: Build production application
        run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-not-for-production
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke and security flows
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-only-auth-secret-not-for-production
          NEXT_TELEMETRY_DISABLED: '1'
          E2E_SERVER_COMMAND: node .next/standalone/server.js
