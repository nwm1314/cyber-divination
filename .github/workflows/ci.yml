name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Bazi skill provenance
        run: npm run check:skill

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        run: npm test

      - name: Run independent Ziwei validation gate
        run: node scripts/compare-iztro.mjs

      - name: Build production application
        run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-not-for-production
          NEXT_TELEMETRY_DISABLED: '1'

      # P0-04 回归门禁：断言静态预渲染路由数不低于阈值。
      # 修复前为 2 条（全站动态）；修复后 17 条。若根布局重新引入
      # cookies()/headers()/searchParams，或页面直接 await 未缓存数据，
      # 该步骤会失败而非静默退化为全站 SSR。
      - name: Verify prerender budget (static routes >= 15)
        run: npm run check:prerender

      # B3：CSP 的 script-src 必须与构建产物的内联脚本状况一致（双向不变量）
      - name: Verify CSP matches inline-script state of build output
        run: npm run check:csp

      # P2 A6 修复：此前 check:prod-env 在非 production 下静默跳过，
      # 且 CI 从未调用它 → 生产配置错误无法在合并前暴露。
      # 这里显式以 production 模式运行，并补一份「合规样例环境」，
      # 断言校验器本身能通过（防止校验器误报导致部署阻塞）。
      - name: Verify production env validator fails closed
        run: |
          if node scripts/validate-prod-env.mjs 2>/dev/null; then
            echo "::error::check:prod-env 在非 production 下不应静默通过"
            exit 1
          fi
          echo "OK: 非 production 下 fail-closed"

      - name: Verify production env validator accepts a compliant config
        env:
          NODE_ENV: production
          AUTH_SECRET: Zx9pQ2mVt7Lk4Rw8Bn3Hy6Jd1Fg5Cs0Ae2Uo9Pi4Xz7Vb3Nq8Mt5Ky
          CLOUD_STORE_DRIVER: postgres
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DB_SKIP_ENSURE_SCHEMA: '1'
          SHARE_STORE_DRIVER: upstash
          UPSTASH_REDIS_REST_URL: https://ci.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-token
          RATE_LIMIT_DRIVER: redis
          RATE_LIMIT_TRUSTED_PROXY: '0'
        run: npm run check:prod-env

      # B2 回归：请求路径建表（ensureSchema）在生产必须被显式关闭，
      # 否则应用 DB 角色需要 CREATE 权限，且多实例冷启动并发执行同一份 DDL。
      - name: Verify production env validator rejects request-time DDL
        env:
          NODE_ENV: production
          AUTH_SECRET: Zx9pQ2mVt7Lk4Rw8Bn3Hy6Jd1Fg5Cs0Ae2Uo9Pi4Xz7Vb3Nq8Mt5Ky
          CLOUD_STORE_DRIVER: postgres
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          SHARE_STORE_DRIVER: upstash
          UPSTASH_REDIS_REST_URL: https://ci.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-token
          RATE_LIMIT_DRIVER: redis
          RATE_LIMIT_TRUSTED_PROXY: '0'
        run: |
          if node scripts/validate-prod-env.mjs 2>/dev/null; then
            echo "::error::未设 DB_SKIP_ENSURE_SCHEMA=1 时校验器不应通过"
            exit 1
          fi
          echo "OK: 缺少 DB_SKIP_ENSURE_SCHEMA 时 fail-fast"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser smoke and security flows
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-only-auth-secret-not-for-production
          NEXT_TELEMETRY_DISABLED: '1'
          E2E_SERVER_COMMAND: node .next/standalone/server.js
