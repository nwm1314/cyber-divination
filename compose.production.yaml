name: cyber-divination

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: cyber-divination:migrate-production
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLOUD_STORE_DRIVER: postgres
    command: ["npm", "run", "db:migrate"]
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyber-divination:production
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: https://bazi.nwmnow.com
      AUTH_METHOD: magic
      AUTH_ALLOW_DEV_LOGIN: "0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLOUD_STORE_DRIVER: postgres
      DB_SKIP_ENSURE_SCHEMA: "1"
      SHARE_STORE_DRIVER: upstash
      SHARE_TTL_SECONDS: "2592000"
      RATE_LIMIT_DRIVER: redis
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL is required}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
