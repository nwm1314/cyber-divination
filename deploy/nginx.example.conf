# =============================================================================
# Nginx 反向代理配置样例
# 用途：HTTPS 终结 + 反向代理到 Next.js (localhost:3000)
# 使用方式：参考 docs/DEPLOY.md §HTTPS/反向代理
# =============================================================================

# ---- 上游定义 ---------------------------------------------------------------
upstream nextjs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---- HTTP → HTTPS 重定向 ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Keep the non-HSTS baseline on the redirect response as well. HSTS is
    # intentionally emitted only from the TLS virtual host below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 301 https://$host$request_uri;
}

# ---- HTTPS 服务 -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    # -- SSL 证书（使用 certbot/Let's Encrypt） --
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # -- TLS 安全配置（Mozilla Intermediate） --
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -- OCSP Stapling --
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ===== 安全头 ============================================================
    # 基础 CSP：仅允许自身资源、style 允许 unsafe-inline（Tailwind CSS 需要）
    # Keep this policy byte-for-byte aligned with next.config.ts. The hide
    # rules prevent duplicate upstream policies from being combined by a
    # browser; this TLS terminator owns the response headers for this example.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;                          # 已过时；现代浏览器用 CSP
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ===== 反向代理 ==========================================================
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # WebSocket 支持（Next.js 热重载 / 未来需要时）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真实客户端 IP（限流键依赖此处）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append, so the app can trust this single-hop value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connect/Read 超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 请求体限制（参照应用 200_000 字符硬编码）
        client_max_body_size 1m;
    }

    # ===== 健康检查端点（供上游 LB 探活） ====================================
    location /api/health {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== 可选：Proxy Protocol 支持 =========================================
    # 若上游 LB（如 HAProxy、AWS NLB）开启了 Proxy Protocol，改为：
    #   listen 443 ssl http2 proxy_protocol;
    #   set_real_ip_from 10.0.0.0/8;
    #   real_ip_header proxy_protocol;
    #
    # 然后将 proxy_set_header X-Real-IP 改为 $proxy_protocol_addr。
    # 注意：开启 proxy_protocol 后，直连此端口将失败，必须经过支持 Proxy Protocol 的 LB。

    # ===== 可选：Nginx 层 IP 限流作为兜底 =====================================
    # limit_req_zone $binary_remote_addr zone=reading:10m rate=15r/m;
    # limit_req_zone $binary_remote_addr zone=share:10m rate=30r/m;
    # location /api/reading {
    #     limit_req zone=reading burst=5 nodelay;
    #     proxy_pass http://nextjs_backend;
    #     # ... proxy headers ...
    # }
    # location /api/share {
    #     limit_req zone=share burst=10 nodelay;
    #     proxy_pass http://nextjs_backend;
    #     # ... proxy headers ...
    # }

    # ===== 静态资源缓存（可选加速） ==========================================
    location /_next/static {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 1y;
        # Next.js supplies the immutable Cache-Control header for hashed
        # assets. Do not add a location-level header here: Nginx would stop
        # inheriting the security headers defined on the TLS server.
    }
}
